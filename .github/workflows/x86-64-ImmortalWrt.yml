name: x86-64-ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      version:
        description: 选择要编译的版本（all=三个都编）
        required: false
        default: all
        type: choice
        options:
          - all
          - "24.10"
          - "25.12"
          - snapshot
  workflow_call:
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    if: github.event_name != 'workflow_dispatch' || inputs.version == 'all' || inputs.version == matrix.version
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "24.10"
            repo_branch: openwrt-24.10
            kernel_file: kernel-6.6
            tag_suffix: "-24.10"
            artifact_suffix: "-24.10"
            package_extension: ipk
          - version: "25.12"
            repo_branch: openwrt-25.12
            kernel_file: kernel-6.12
            tag_suffix: ""
            artifact_suffix: ""
            package_extension: apk
          - version: snapshot
            repo_branch: master
            kernel_file: kernel-6.12
            tag_suffix: "-snapshot"
            artifact_suffix: "-snapshot"
            package_extension: apk
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/immortalwrt/immortalwrt.git
      repo_branch: ${{ matrix.repo_branch }}
      config_file: configs/x86-64.config
      firmware_tag: x86-64${{ matrix.tag_suffix }}
      kernel_file: ${{ matrix.kernel_file }}
      artifact_prefix: x86.64${{ matrix.artifact_suffix }}
      manifest_file: immortalwrt-x86-64-generic.manifest
      package_extension: ${{ matrix.package_extension }}
      remove_sqm_scripts_nss: true
      release_summary: >-
        这是基于ImmortalWrt主线制作的固件，默认主题为Aurora；该固件在ImmortalWrt的基础上，添加了额外的软件包ddns、upnp、wol、samba4、vlmcsd、aria2、autoreboot、uhttpd、frps、frpc、diskman、hd-idle、acme、openlist2、dockerman、gecoosac、wireguard、watchcat、3cat、passwall，并添加了若干工具，具体详见x86-64.config和General.config。
