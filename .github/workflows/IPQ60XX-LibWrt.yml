name: IPQ60XX-LibWrt

on:
  workflow_dispatch:
    inputs:
      version:
        description: 选择要编译的版本（all=三个都编）
        required: false
        default: all
        type: choice
        options:
          - all
          - "24.10"
          - "25.12"
          - snapshot
  workflow_call:
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    if: github.event_name != 'workflow_dispatch' || inputs.version == 'all' || inputs.version == matrix.version
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "24.10"
            repo_branch: 24.10
            kernel_file: kernel-6.6
            tag_suffix: "-24.10"
            artifact_suffix: "-24.10"
            package_extension: ipk
          - version: "25.12"
            repo_branch: 25.12-nss
            kernel_file: kernel-6.12
            tag_suffix: ""
            artifact_suffix: ""
            package_extension: apk
          - version: snapshot
            repo_branch: master
            kernel_file: kernel-6.12
            tag_suffix: "-snapshot"
            artifact_suffix: "-snapshot"
            package_extension: apk
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/laipeng668/openwrt-6.x.git
      repo_branch: ${{ matrix.repo_branch }}
      config_file: configs/IPQ60XX.config
      firmware_tag: IPQ60XX${{ matrix.tag_suffix }}
      kernel_file: ${{ matrix.kernel_file }}
      artifact_prefix: IPQ60XX${{ matrix.artifact_suffix }}
      manifest_file: libwrt-qualcommax-ipq60xx.manifest
      package_extension: ${{ matrix.package_extension }}
      release_summary: >-
        这是开启全功能NSS的6.12内核固件，默认主题为Aurora；该固件在ImmortalWrt的基础上，添加了额外的软件包cpufreq、ddns、upnp、wol、samba4、vlmcsd、autoreboot、uhttpd、frps、frpc、diskman、hd-idle、acme、wireguard、watchcat、3cat、passwall，并添加了若干工具，具体详见IPQ60XX.config和General.config。
